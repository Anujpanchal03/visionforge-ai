services:
  # ----------------------------------------------------
  # VisionForge AI - Backend Web Service (Node.js/Express)
  # ----------------------------------------------------
  - type: web
    name: visionforge-ai-backend
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIPDROP_API
        sync: false
      - key: CURRENCY
        value: USD
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  # ----------------------------------------------------
  # VisionForge AI - Frontend Static Site (React/Vite)
  # ----------------------------------------------------
  - type: web
    name: visionforge-ai-frontend
    runtime: static
    rootDir: client
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: visionforge-ai-backend
          property: host
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
